<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>答案同步 · 双链接</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: linear-gradient(145deg, #f6f9fc 0%, #e9f0f5 100%);
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px;
  }
  .card {
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(8px);
    border-radius: 42px;
    box-shadow: 0 30px 50px -20px rgba(0,20,30,0.25), 0 0 0 1px rgba(255,255,255,0.6) inset;
    padding: 32px 28px 28px 28px;
    width: 100%; max-width: 680px;
    position: relative;
  }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
  .header h1 {
    font-size: 1.7rem; font-weight: 600;
    background: linear-gradient(135deg, #1e293b, #2d3a4e);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    display: flex; align-items: center; gap: 10px;
  }
  .badge { background: #d1fae5; color: #065f46; font-size: 0.8rem; font-weight: 600; padding: 6px 16px; border-radius: 100px; white-space: nowrap; }
  .drop-zone { border: 2px dashed #cbd5e1; border-radius: 28px; padding: 24px 20px; text-align: center; color: #64748b; font-size: 0.95rem; cursor: pointer; transition: all 0.15s; background: #f8fafc; margin-bottom: 20px; }
  .drop-zone.dragover { border-color: #3b82f6; background: #eff6ff; }
  .drop-zone strong { color: #1e293b; }
  .bank-select { display: none; background: #f8fafc; border-radius: 28px; padding: 28px 24px; margin-bottom: 20px; border: 1px solid #e9eef3; }
  .bank-select h2 { font-size: 1.15rem; font-weight: 600; color: #1e293b; margin-bottom: 18px; text-align: center; }
  .bank-options { display: flex; flex-direction: column; gap: 12px; margin-bottom: 22px; }
  .bank-option { display: flex; align-items: center; gap: 12px; padding: 14px 18px; background: white; border-radius: 18px; border: 1px solid #e2e8f0; cursor: pointer; transition: all 0.15s; font-size: 1rem; color: #1e293b; font-weight: 500; }
  .bank-option:hover { border-color: #93c5fd; background: #f0f7ff; }
  .bank-option input[type="checkbox"] { width: 20px; height: 20px; accent-color: #1e293b; cursor: pointer; flex-shrink: 0; }
  .bank-option.selected { border-color: #3b82f6; background: #eff6ff; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
  .bank-confirm-btn { width: 100%; border: none; background: #1e293b; color: white; padding: 16px; border-radius: 60px; font-size: 1.05rem; font-weight: 600; cursor: pointer; box-shadow: 0 12px 24px -10px #1e293b80; }
  .bank-confirm-btn:hover { background: #0f172a; }
  .content-area { background: #ffffff; border-radius: 32px; padding: 36px 24px; margin-bottom: 24px; box-shadow: 0 8px 20px -6px rgba(0,20,30,0.08), 0 0 0 1px #eef2f6 inset; height: 220px; display: none; align-items: center; justify-content: center; text-align: center; overflow: hidden; }
  .content-area.visible { display: flex; }
  .qa-block { display: flex; flex-direction: column; gap: 16px; width: 100%; }
  .qa-item { padding: 16px; border-radius: 20px; text-align: left; }
  .qa-item.q { background: #f0f7ff; border-left: 6px solid #3b82f6; }
  .qa-item.a { background: #e9f9ef; border-left: 6px solid #10b981; }
  .qa-label { font-size: 0.8rem; font-weight: 700; margin-bottom: 6px; }
  .qa-item.q .qa-label { color: #3b82f6; }
  .qa-item.a .qa-label { color: #10b981; }
  .question-text { font-size: 2.2rem; font-weight: 700; line-height: 1.3; color: #0b1e2e; word-break: break-word; }
  .answer-text { font-size: 2.2rem; font-weight: 700; line-height: 1.3; color: #0b3b2e; word-break: break-word; }
  .button-row { display: flex; gap: 12px; justify-content: center; margin-top: 8px; }
  .btn { flex: 1; border: none; background: white; padding: 14px 20px; border-radius: 60px; font-size: 1rem; font-weight: 600; cursor: pointer; box-shadow: 0 6px 16px -6px rgba(0,0,0,0.1), 0 0 0 1px #e2e8f0; color: #1e293b; }
  .btn-primary { background: #1e293b; color: white; box-shadow: 0 12px 24px -10px #1e293b80; }
  .btn-primary:hover { background: #0f172a; }
  .progress-hint { margin-top: 12px; font-size: 0.8rem; color: #64748b; text-align: center; }
  .footer-note { margin-top: 16px; font-size: 0.75rem; color: #94a3b8; text-align: center; }
  .clear-file-btn { position: absolute; bottom: 18px; right: 30px; background: transparent; border: none; color: #c0c8d4; font-size: 0.8rem; cursor: pointer; }
  .clear-file-btn:hover { color: #ef4444; }
  .new-game-btn { position: absolute; bottom: 18px; left: 30px; background: transparent; border: none; color: #c0c8d4; font-size: 0.8rem; cursor: pointer; }
  .new-game-btn:hover { color: #3b82f6; }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <h1>📋 答案 (含题目)</h1>
    <span class="badge">题目 + 答案</span>
  </div>
  <div class="drop-zone" id="dropZone">
    📂 把 Excel 文件拖到这里，或 <strong>点击选择</strong><br>
    <span style="font-size:0.8rem;">（支持.xlsx/.xls，第一行为题目，第二行为答案）</span>
  </div>
  <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none">
  <div class="bank-select" id="bankSelect">
    <h2>请选择你的题库</h2>
    <div class="bank-options" id="bankOptions">
      <label class="bank-option"><input type="checkbox" value="0"> 男频</label>
      <label class="bank-option"><input type="checkbox" value="1"> 女频</label>
      <label class="bank-option"><input type="checkbox" value="2"> 其他网文相关</label>
      <label class="bank-option"><input type="checkbox" value="3"> 挑战高难</label>
    </div>
    <button class="bank-confirm-btn" id="bankConfirmBtn">确 定</button>
  </div>
  <div class="content-area" id="contentArea"></div>
  <div class="button-row" id="mainButtons" style="display:none;">
    <button class="btn btn-primary" id="nextBtn">🎲 下一题</button>
  </div>
  <div id="statusMsg" style="display:none;text-align:center;font-size:1rem;color:#64748b;padding:20px;"></div>
  <div class="progress-hint" id="progressHint"></div>
  <div class="footer-note">⚡ 这是操作端，点「下一题」两个页面同步更新。</div>
  <button class="new-game-btn" id="newGameBtn">新的一局</button>
  <button class="clear-file-btn" id="clearFileBtn">清除文件</button>
</div>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script type="module" src="/src/answer.js"></script>
</body>
</html>
